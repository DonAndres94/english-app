<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Vocabulary & Skills Builder Pro</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #5C6AC4;
            --success: #2ECC71;
            --danger: #E74C3C;
            --bg: #F4F7F6;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 15px;
            text-align: center;
        }

        h1 { margin: 0; font-size: 1.3rem; }

        nav {
            display: flex;
            background: #EAECEE;
            border-bottom: 1px solid #DDD;
            flex-wrap: wrap;
        }

        nav button {
            flex: 1;
            padding: 12px 6px;
            border: none;
            background: none;
            font-size: 0.75rem;
            font-weight: bold;
            color: #7F8C8D;
            cursor: pointer;
            transition: 0.3s;
            min-width: 60px;
        }

        nav button.active {
            color: var(--primary);
            background: white;
            border-bottom: 3px solid var(--primary);
        }

        .tab-content {
            padding: 15px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        select, input {
            padding: 10px;
            border: 1px solid #CCC;
            border-radius: 6px;
            font-size: 1rem;
            flex: 1;
            min-width: 150px;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #EEE;
            font-size: 0.95rem;
        }

        th { background-color: #F8F9F9; }

        .category-title {
            background-color: var(--primary);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 20px;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .audio-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .card-box {
            background: #F8F9F9;
            border: 1px solid #E5E7E9;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .listening-line {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #E5E7E9;
            margin-bottom: 10px;
            text-align: left;
            font-size: 1rem;
            line-height: 1.8;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        @media (min-width: 600px) {
            .quiz-options {
                grid-template-columns: 1fr 1fr;
            }
        }

        .quiz-btn, .action-btn {
            padding: 12px;
            border: 1px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }

        .quiz-btn:hover, .action-btn:hover {
            background: var(--primary);
            color: white;
        }

        .correct { background: var(--success) !important; color: white !important; }
        .wrong { background: var(--danger) !important; color: white !important; }

        .blank-input {
            width: 90px;
            padding: 4px;
            text-align: center;
            border: 1px solid var(--primary);
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        @media(min-width: 600px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #E5E7E9;
            text-align: center;
        }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: #7F8C8D; }
        .stat-card .value { font-size: 1.8rem; font-weight: bold; color: var(--primary); }

        .writing-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #E5E7E9;
            margin-bottom: 15px;
            font-size: 0.95rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>English Vocabulary & Skills</h1>
    </header>

    <nav>
        <button class="active" onclick="switchTab('daily', event)">📅 Day</button>
        <button onclick="switchTab('writing', event)">✍️ Writing</button>
        <button onclick="switchTab('listening', event)">🎧 Listening</button>
        <button onclick="switchTab('repository', event)">📚 Dictionary</button>
        <button onclick="switchTab('stats', event)">📊 Stats</button>
    </nav>

    <!-- TAB 1: SCHEDA GIORNO -->
    <div id="daily" class="tab-content active">
        <div class="controls">
            <h2 style="font-size: 1.1rem; margin:0;">📅 Daily Program</h2>
        </div>
        <div id="dailyTableContainer"></div>
    </div>

    <!-- TAB 2: WRITING & PRACTICE -->
    <div id="writing" class="tab-content">
        <div class="controls" style="background: white; padding: 10px; border-radius: 8px; border: 1px solid #E5E7E9;">
            <label for="sessionSizeSelect"><strong>Session Questions:</strong></label>
            <select id="sessionSizeSelect" onchange="restartWritingSession()">
                <option value="10">10 Questions</option>
                <option value="20" selected>20 Questions</option>
                <option value="40">40 Questions</option>
                <option value="60">60 Questions</option>
                <option value="all">All Dictionary Words</option>
            </select>
            <button class="action-btn" style="width: auto; padding: 8px 15px;" onclick="restartWritingSession()">🔄 Restart</button>
        </div>

        <div class="card-box" id="writingArea">
            <!-- Dynamic content loaded via JS -->
        </div>
    </div>

    <!-- TAB 3: LISTENING -->
    <div id="listening" class="tab-content">
        <div class="card-box">
            <h3>🎧 English Audio & Video Practice</h3>
            <div class="controls" style="margin-top: 15px;">
                <label for="listeningCategorySelect"><strong>Category:</strong></label>
                <select id="listeningCategorySelect" onchange="changeListeningCategory()">
                    <option value="music">🎵 Music (English Lyrics)</option>
                    <option value="documentary">🌍 Documentary (Nature & Science)</option>
                    <option value="podcast">🎙️ Interview / Podcast (TED & Talks)</option>
                </select>
            </div>

            <div class="video-container" id="youtubeContainer"></div>

            <p style="text-align: left; font-weight: bold; color: #555;">Complete the missing words (<span id="videoCounter">1/4</span>):</p>
            <div id="listeningSentencesContainer"></div>

            <button class="action-btn" onclick="checkListeningAnswers()">Check Answers</button>
            <br><br>
            <button class="action-btn" style="background:#27AE60; border-color:#27AE60; color:white;" onclick="nextVideoInCategory()">🔄 Next Video</button>
            <p id="listeningFeedback"></p>
        </div>
    </div>

    <!-- TAB 4: DIZIONARIO -->
    <div id="repository" class="tab-content">
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search word..." onkeyup="filterRepository()">
            <select id="categorySelect" onchange="filterRepository()">
                <option value="">📂 All categories</option>
            </select>
        </div>
        <div id="repoTableContainer"></div>
    </div>

    <!-- TAB 5: STATS -->
    <div id="stats" class="tab-content">
        <div class="card-box">
            <h3>📊 Learning Statistics Sheet</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Dictionary Words</h3>
                    <div class="value" id="statTotalWords">0</div>
                </div>
                <div class="stat-card">
                    <h3>Exercises Completed</h3>
                    <div class="value" id="statCompleted">0</div>
                </div>
                <div class="stat-card">
                    <h3>Words in Review Queue (Errors)</h3>
                    <div class="value" id="statQueueSize">0</div>
                </div>
                <div class="stat-card">
                    <h3>Review Session Progress</h3>
                    <div class="value" id="statProgress">0%</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const dictionaryData = [

const listeningDatabase = {
    music: [
        { videoId: "fJ9rUzIMcZQ", lines: ["We have to <input class='blank-input' data-ans='improve'> our rhythm every single day.", "You cannot <input class='blank-input' data-ans='avoid'> the truth when the music plays."] },

        { videoId: "OPf0YbXqDm0", lines: ["Every single artist wants to <input class='blank-input' data-ans='accomplish'> success.", "Never let fear <input class='blank-input' data-ans='challenge'> your creative passion."] }
    ],

        { videoId: "J---aiyznGQ", lines: ["Wildlife must <input class='blank-input' data-ans='adapt'> to survive changing climates.", "Researchers try to <input class='blank-input' data-ans='acquire'> accurate data from nature."] },
        { videoId: "C0DPdy98e4c", lines: ["We must <input class='blank-input' data-ans='address'> environmental challenges immediately.", "Scientists work to <input class='blank-input' data-ans='establish'> new ecological reserves."] },
        { videoId: "9bZkp7q19f0", lines: ["Explorers need to <input class='blank-input' data-ans='evaluate'> the terrain carefully.", "We can <input class='blank-input' data-ans='expand'> our knowledge about remote habitats."] },
        { videoId: "ZZ5LpwO-An4", lines: ["It is essential to <input class='blank-input' data-ans='handle'> natural resources wisely.", "We must <input class='blank-input' data-ans='determine'> the impact of human activities."] }
    ],
    podcast: [
        { videoId: "5qap5aO4i9A", lines: ["Successful leaders know how to <input class='blank-input' data-ans='handle'> high pressure.", "We need to <input class='blank-input' data-ans='determine'> our priorities carefully."] },
        { videoId: "R_fZjGm2OrM", lines: ["You must <input class='blank-input' data-ans='accomplish'> your daily targets.", "It takes true <input class='blank-input' data-ans='dedication'> to build a successful career."] },
        { videoId: "ZXsQAXx_ao0", lines: ["Great speakers always <input class='blank-input' data-ans='encourage'> their audience.", "We should <input class='blank-input' data-ans='facilitate'> open discussions on important topics."] },
        { videoId: "L_LUpnjgPso", lines: ["Every professional must <input class='blank-input' data-ans='acknowledge'> their own mistakes.", "Take time to <input class='blank-input' data-ans='evaluate'> your long term goals."] }
    ]
};

// Variabili per la gestione dello stato di Writing
let practiceQueue = [];
let totalSessionTarget = 20;
let sessionCompletedCount = 0;
let globalCompletedCount = 0;
let currentWritingType = 1;
let currentWritingData = null;
let currentVideoIndexes = { music: 0, documentary: 0, podcast: 0 };

function initApp() {
    initCategorySelect();
    loadDailyCards();
    renderRepository(dictionaryData);
    restartWritingSession();
    updateStatsDisplay();
}

function restartWritingSession() {
    const selectVal = document.getElementById('sessionSizeSelect').value;
    if (selectVal === 'all') {
        totalSessionTarget = dictionaryData.length;
    } else {
        totalSessionTarget = parseInt(selectVal);
    }

    sessionCompletedCount = 0;
    
    // Crea una copia del dizionario e mescolala
    let shuffled = [...dictionaryData].sort(() => Math.random() - 0.5);
    
    // Taglia in base al numero di quesiti scelti (se ci sono abbastanza parole)
    if (shuffled.length > totalSessionTarget) {
        practiceQueue = shuffled.slice(0, totalSessionTarget);
    } else {
        practiceQueue = shuffled;
        totalSessionTarget = practiceQueue.length;
    }

    generateWritingExercise();
    updateStatsDisplay();
}

function initCategorySelect() {
    const categories = [...new Set(dictionaryData.map(w => w.category))].sort();
    const select = document.getElementById('categorySelect');
    categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        select.appendChild(option);
    });
}

function loadDailyCards() {
    const words = dictionaryData.filter(w => w.day === 1);
    let html = `<table><thead><tr><th>Inglese</th><th>Pronuncia</th><th>🇮🇹 Italiano</th></tr></thead><tbody>`;
    words.forEach(w => {
        html += `<tr>
            <td><strong>${w.en}</strong> <button class="audio-btn" onclick="speak('${w.en}')">🔊</button></td>
            <td><em>${w.fig}</em></td>
            <td>${w.it}</td>
        </tr>`;
    });
    html += `</tbody></table>`;
    document.getElementById('dailyTableContainer').innerHTML = html;
}

function renderRepository(words) {
    const container = document.getElementById('repoTableContainer');
    if (words.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--danger); font-weight: bold; margin-top: 20px;">No words found</p>`;
        return;
    }

    const sortedWords = [...words].sort((a, b) => {
        if (a.category < b.category) return -1;
        if (a.category > b.category) return 1;
        return a.en.localeCompare(b.en);
    });

    const grouped = {};
    sortedWords.forEach(w => {
        if (!grouped[w.category]) grouped[w.category] = [];
        grouped[w.category].push(w);
    });

    let html = "";
    for (const [category, catWords] of Object.entries(grouped)) {
        html += `<div class="category-title">📂 ${category}</div>`;
        html += `<table><thead><tr><th>Inglese</th><th>Pronuncia</th><th>🇮🇹 Italiano</th><th>Day</th></tr></thead><tbody>`;
        catWords.forEach(w => {
            html += `<tr>
                <td><strong>${w.en}</strong> <button class="audio-btn" onclick="speak('${w.en}')">🔊</button></td>
                <td><em>${w.fig}</em></td>
                <td>${w.it}</td>
                <td>Day ${w.day}</td>
            </tr>`;
        });
        html += `</tbody></table>`;
    }
    container.innerHTML = html;
}

function filterRepository() {
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const selectedCategory = document.getElementById('categorySelect').value;

    const filtered = dictionaryData.filter(w => {
        const matchesSearch = search === "" || 
            w.en.toLowerCase().includes(search) || 
            w.it.toLowerCase().includes(search);

        const matchesCategory = selectedCategory === "" || w.category === selectedCategory;
        return matchesSearch && matchesCategory;
    });
    renderRepository(filtered);
}

function speak(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    window.speechSynthesis.speak(utterance);
}

function switchTab(tabId, event) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');

    if (tabId === 'writing') {
        // Se la sessione è completata o vuota all'apertura, riavvia
        if (practiceQueue.length === 0 && sessionCompletedCount >= totalSessionTarget) {
            restartWritingSession();
        } else {
            generateWritingExercise();
        }
    }
    if (tabId === 'listening') loadListeningExercise();
    if (tabId === 'stats') updateStatsDisplay();
}

function generateWritingExercise() {
    const area = document.getElementById('writingArea');
    
    // Se la sessione corrente è terminata
    if (practiceQueue.length === 0) {
        area.innerHTML = `
            <h3>🎉 Session Completed!</h3>
            <p>You have successfully completed all ${totalSessionTarget} questions in this session.</p>
            <br>
            <button class="action-btn" onclick="restartWritingSession()">Start New Session</button>
        `;
        return;
    }

    currentWritingData = practiceQueue[0];
    currentWritingType = Math.floor(Math.random() * 3) + 1;

    let progressHtml = `
        <div class="writing-header-bar">
            <span>📝 Progress: ${sessionCompletedCount} / ${totalSessionTarget} done</span>
            <span style="color: #7F8C8D; font-size: 0.85rem;">Queue (Errors to retry): ${practiceQueue.length}</span>
        </div>
    `;

    if (currentWritingType === 1) {
        area.innerHTML = progressHtml + `
            <h3>✍️ Exercise: Translate to English</h3>
            <p>Translate this Italian expression:</p>
            <h2 style="color: var(--primary);">${currentWritingData.it}</h2>
            <p><small>Pronunciation: <em>${currentWritingData.fig}</em></small></p>
            <input type="text" id="writingInput" placeholder="Type in English..." autocomplete="off">
            <br><br>
            <button class="action-btn" onclick="checkWritingAnswer()">Check Answer</button>
            <p id="writingFeedback"></p>
        `;
    } else if (currentWritingType === 2) {
        let sentenceWithBlank = currentWritingData.sentence.replace(currentWritingData.en, "_____");
        area.innerHTML = progressHtml + `
            <h3>✍️ Exercise: Complete the Sentence</h3>
            <p>Fill in the blank with the correct English word:</p>
            <h3 style="background: white; padding: 12px; border-radius: 6px; border: 1px solid #E5E7E9;">"${sentenceWithBlank}"</h3>
            <p><small>Italian hint: <strong>${currentWritingData.it}</strong></small></p>
            <input type="text" id="writingInput" placeholder="Missing word..." autocomplete="off">
            <br><br>
            <button class="action-btn" onclick="checkWritingAnswer()">Check Answer</button>
            <p id="writingFeedback"></p>
        `;
    } else {
        let options = [currentWritingData.en];
        while(options.length < 4) {
            let rand = dictionaryData[Math.floor(Math.random() * dictionaryData.length)].en;
            if(!options.includes(rand)) options.push(rand);
        }
        options.sort(() => Math.random() - 0.5);

        area.innerHTML = progressHtml + `
            <h3>✍️ Exercise: Match the Translation</h3>
            <p>Select the correct English word for:</p>
            <h2 style="color: var(--primary);">"${currentWritingData.it}"</h2>
            <div class="quiz-options">
                ${options.map(opt => `<button class="quiz-btn" onclick="checkMatchingAnswer(this, '${opt}')">${opt}</button>`).join('')}
            </div>
            <p id="writingFeedback"></p>
        `;
    }
}

function checkWritingAnswer() {
    const inputField = document.getElementById('writingInput');
    const input = inputField.value.trim().toLowerCase();
    const feedback = document.getElementById('writingFeedback');
    
    if (input === currentWritingData.en.toLowerCase()) {
        practiceQueue.shift();
        sessionCompletedCount++;
        globalCompletedCount++;
        feedback.innerHTML = "<strong style='color:var(--success)'>Correct! 🎉 Loading next...</strong>";
        setTimeout(generateWritingExercise, 1000);
    } else {
        const wrongWord = practiceQueue.shift();
        practiceQueue.push(wrongWord);
        feedback.innerHTML = `<span style='color:var(--danger)'>Incorrect. The correct word was: <strong>${currentWritingData.en}</strong>. It will be repeated later.</span>`;
        setTimeout(generateWritingExercise, 2000);
    }
    updateStatsDisplay();
}

function checkMatchingAnswer(btn, selected) {
    const feedback = document.getElementById('writingFeedback');
    if (selected === currentWritingData.en) {
        btn.classList.add('correct');
        practiceQueue.shift();
        sessionCompletedCount++;
        globalCompletedCount++;
        feedback.innerHTML = "<strong style='color:var(--success)'>Correct match! 🎉 Loading next...</strong>";
        setTimeout(generateWritingExercise, 1000);
    } else {
        btn.classList.add('wrong');
        const wrongWord = practiceQueue.shift();
        practiceQueue.push(wrongWord);
        feedback.innerHTML = `<span style='color:var(--danger)'>Wrong. It was: ${currentWritingData.en}. It will be repeated later.</span>`;
        setTimeout(generateWritingExercise, 2000);
    }
    updateStatsDisplay();
}

function loadListeningExercise() {
    const category = document.getElementById('listeningCategorySelect').value;
    const videoList = listeningDatabase[category];
    const currentIndex = currentVideoIndexes[category];
    const currentEx = videoList[currentIndex];

    document.getElementById('youtubeContainer').innerHTML = `
        <iframe src="https://www.youtube.com/embed/${currentEx.videoId}" allowfullscreen></iframe>
    `;

    document.getElementById('videoCounter').innerText = `${currentIndex + 1}/${videoList.length}`;

    let linesHtml = "";
    currentEx.lines.forEach((line, index) => {
        linesHtml += `<div class="listening-line"><strong>Sentence ${index + 1}:</strong> ${line}</div>`;
    });
    document.getElementById('listeningSentencesContainer').innerHTML = linesHtml;
    document.getElementById('listeningFeedback').innerHTML = "";
}

function changeListeningCategory() {
    loadListeningExercise();
}

function nextVideoInCategory() {
    const category = document.getElementById('listeningCategorySelect').value;
    const videoList = listeningDatabase[category];
    
    currentVideoIndexes[category] = (currentVideoIndexes[category] + 1) % videoList.length;
    loadListeningExercise();
}

function checkListeningAnswers() {
    const inputs = document.querySelectorAll('#listeningSentencesContainer .blank-input');
    const feedback = document.getElementById('listeningFeedback');
    let correct = true;
    
    inputs.forEach(input => {
        const expected = input.getAttribute('data-ans').toLowerCase();
        if (input.value.trim().toLowerCase() === expected) {
            input.style.borderColor = "var(--success)";
            input.style.backgroundColor = "#e8f8f0";
        } else {
            input.style.borderColor = "var(--danger)";
            input.style.backgroundColor = "#fdeed9";
            correct = false;
        }
    });

    if(correct) {
        feedback.innerHTML = "<strong style='color:var(--success)'>All sentences are correct! Great job! 🎉</strong>";
        globalCompletedCount++;
    } else {
        feedback.innerHTML = "<span style='color:var(--danger)'>Some highlighted fields have errors. Listen again and try!</span>";
    }
    updateStatsDisplay();
}

function updateStatsDisplay() {
    document.getElementById('statTotalWords').innerText = dictionaryData.length;
    document.getElementById('statCompleted').innerText = globalCompletedCount;
    document.getElementById('statQueueSize').innerText = practiceQueue.length;
    
    let progress = Math.round((sessionCompletedCount / totalSessionTarget) * 100) || 0;
    document.getElementById('statProgress').innerText = progress + "%";
}

initApp();
</script>
</body>
</html>
