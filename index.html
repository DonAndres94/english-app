<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Vocabulary & Skills Builder Pro</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #5C6AC4;
            --success: #2ECC71;
            --danger: #E74C3C;
            --bg: #F4F7F6;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 15px;
            text-align: center;
        }

        h1 { margin: 0; font-size: 1.3rem; }

        nav {
            display: flex;
            background: #EAECEE;
            border-bottom: 1px solid #DDD;
            flex-wrap: wrap;
        }

        nav button {
            flex: 1;
            padding: 12px 6px;
            border: none;
            background: none;
            font-size: 0.75rem;
            font-weight: bold;
            color: #7F8C8D;
            cursor: pointer;
            transition: 0.3s;
            min-width: 60px;
        }

        nav button.active {
            color: var(--primary);
            background: white;
            border-bottom: 3px solid var(--primary);
        }

        .tab-content {
            padding: 15px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        select, input, textarea {
            padding: 10px;
            border: 1px solid #CCC;
            border-radius: 6px;
            font-size: 1rem;
            flex: 1;
            min-width: 150px;
            box-sizing: border-box;
            font-family: inherit;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #EEE;
            font-size: 0.9rem;
        }

        th { background-color: #F8F9F9; }

        .category-title {
            background-color: var(--primary);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 20px;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .audio-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .card-box {
            background: #F8F9F9;
            border: 1px solid #E5E7E9;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .listening-line {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #E5E7E9;
            margin-bottom: 10px;
            text-align: left;
            font-size: 1rem;
            line-height: 1.8;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        @media (min-width: 600px) {
            .quiz-options {
                grid-template-columns: 1fr 1fr;
            }
        }

        .quiz-btn, .action-btn {
            padding: 12px;
            border: 1px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }

        .quiz-btn:hover, .action-btn:hover {
            background: var(--primary);
            color: white;
        }

        .correct { background: var(--success) !important; color: white !important; }
        .wrong { background: var(--danger) !important; color: white !important; }

        .blank-input {
            width: 90px;
            padding: 4px;
            text-align: center;
            border: 1px solid var(--primary);
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        @media(min-width: 600px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #E5E7E9;
            text-align: center;
        }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: #7F8C8D; }
        .stat-card .value { font-size: 1.8rem; font-weight: bold; color: var(--primary); }

        .writing-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #E5E7E9;
            margin-bottom: 15px;
            font-size: 0.95rem;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>

    <!-- TAB 1: SCHEDA GIORNO -->

    <!-- TAB 3: LISTENING -->

                <label for="listeningCategorySelect"><strong>Category:</strong></label>

            <div id="listeningSentencesContainer"></div>

            <button class="action-btn" onclick="checkListeningAnswers()">Check Answers</button>

            <button class="action-btn" style="background:#27AE60; border-color:#27AE60; color:white;" onclick="nextVideoInCategory()">🔄 Next Video</button>

    <!-- TAB 4: DIZIONARIO -->
    <div id="repository" class="tab-content">
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search word..." onkeyup="filterRepository()">
            <select id="categorySelect" onchange="filterRepository()">

        </div>
        <div id="repoTableContainer"></div>

    <!-- TAB 5: STATS -->
    <div id="stats" class="tab-content">

            <h3>📊 Learning Statistics & Error Ranking</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Dictionary Words</h3>
                    <div class="value" id="statTotalWords">0</div>
                </div>
                <div class="stat-card">
                    <h3>Exercises Completed</h3>

                </div>
                <div class="stat-card">
                    <h3>Session Progress</h3>
                    <div class="value" id="statProgress">0%</div>

                <div class="stat-card">
                    <h3>Total Errors Tracked</h3>
                    <div class="value" id="statTotalErrors">0</div>

            </div>
            
            <div style="margin-top: 20px; text-align: left;">
                <h3 style="color: #7F8C8D; margin-bottom: 10px;">⚠️ Top 10 Error Words (Cumulative)</h3>

            <br>
            <button class="action-btn" style="background: var(--danger); border-color: var(--danger); color: white;" onclick="resetStatsData()">🗑️ Reset General Statistics</button>
        </div>
    </div>
</div>

    music: [
        { videoId: "fJ9rUzIMcZQ", lines: ["We have to <input class='blank-input' data-ans='improve'> our rhythm every single day.", "You cannot <input class='blank-input' data-ans='avoid'> the truth when the music plays."] },
        { videoId: "kJQP7kiw5Fk", lines: ["We will <input class='blank-input' data-ans='achieve'> greatness through our song.", "It takes deep <input class='blank-input' data-ans='commitment'> to keep singing."] },
        { videoId: "3JZ_D3ELwOQ", lines: ["Sometimes we need to <input class='blank-input' data-ans='adapt'> to new melodies.", "Listen close and try to <input class='blank-input' data-ans='acquire'> the exact tone."] },
        { videoId: "OPf0YbXqDm0", lines: ["Every single artist wants to <input class='blank-input' data-ans='accomplish'> success.", "Never let fear <input class='blank-input' data-ans='challenge'> your creative passion."] }
    ],
    documentary: [
        { videoId: "J---aiyznGQ", lines: ["Wildlife must <input class='blank-input' data-ans='adapt'> to survive changing climates.", "Researchers try to <input class='blank-input' data-ans='acquire'> accurate data from nature."] },
        { videoId: "C0DPdy98e4c", lines: ["We must <input class='blank-input' data-ans='address'> environmental challenges immediately.", "Scientists work to <input class='blank-input' data-ans='establish'> new ecological reserves."] },
        { videoId: "9bZkp7q19f0", lines: ["Explorers need to <input class='blank-input' data-ans='evaluate'> the terrain carefully.", "We can <input class='blank-input' data-ans='expand'> our knowledge about remote habitats."] },
        { videoId: "ZZ5LpwO-An4", lines: ["It is essential to <input class='blank-input' data-ans='handle'> natural resources wisely.", "We must <input class='blank-input' data-ans='determine'> the impact of human activities."] }
    ],
    podcast: [
        { videoId: "5qap5aO4i9A", lines: ["Successful leaders know how to <input class='blank-input' data-ans='handle'> high pressure.", "We need to <input class='blank-input' data-ans='determine'> our priorities carefully."] },
        { videoId: "R_fZjGm2OrM", lines: ["You must <input class='blank-input' data-ans='accomplish'> your daily targets.", "It takes true <input class='blank-input' data-ans='dedication'> to build a successful career."] },
        { videoId: "ZXsQAXx_ao0", lines: ["Great speakers always <input class='blank-input' data-ans='encourage'> their audience.", "We should <input class='blank-input' data-ans='facilitate'> open discussions on important topics."] },
        { videoId: "L_LUpnjgPso", lines: ["Every professional must <input class='blank-input' data-ans='acknowledge'> their own mistakes.", "Take time to <input class='blank-input' data-ans='evaluate'> your long term goals."] }
    ]
};

let customAddedWords = JSON.parse(localStorage.getItem('eng_custom_dictionary')) || [];
let dictionaryData = [...baseDictionary, ...customAddedWords];

let practiceList = [];
let totalSessionTarget = 20;
let sessionCompletedCount = 0;
let globalCompletedCount = parseInt(localStorage.getItem('eng_completed_count')) || 0;
let errorTrackingCounts = JSON.parse(localStorage.getItem('eng_error_tracking')) || {};

let currentWritingType = 1;
let currentWritingData = null;
let currentVideoIndexes = { music: 0, documentary: 0, podcast: 0 };

function initApp() {
    initCategorySelect();
    loadDailyCards();
    renderRepository(dictionaryData);
    restartWritingSession();
    updateStatsDisplay();
}

function toggleWritingMode() {
    const mode = document.getElementById('writingModeSelect').value;
    const practiceControls = document.getElementById('practiceControls');
    const area = document.getElementById('writingArea');

    if (mode === 'essay') {
        practiceControls.style.display = 'none';
        area.innerHTML = `
            <h3>✍️ Free Writing & Essay Correction</h3>
            <p style="text-align: left; color: #555; font-size: 0.9rem;">Scrivi un piccolo saggio o un testo libero in inglese. Il sistema analizzerà il testo e aggiungerà automaticamente eventuali parole nuove o complesse nel tuo dizionario!</p>
            <textarea id="essayInput" rows="6" placeholder="Type your essay or paragraph in English here..."></textarea>
            <br><br>
            <button class="action-btn" onclick="submitEssayForCorrection()">🔍 Analyze & Correct Text</button>
            <div id="essayFeedback" style="margin-top: 15px; text-align: left;"></div>
        `;
    } else if (mode === 'reviewErrors') {
        practiceControls.style.display = 'none';
        startErrorReviewSession();
    } else {
        practiceControls.style.display = 'flex';
        restartWritingSession();
    }
}

function startErrorReviewSession() {
    const errorWords = Object.keys(errorTrackingCounts);
    if (errorWords.length === 0) {
        document.getElementById('writingArea').innerHTML = `
            <h3>🔄 Review My Top Errors</h3>
            <p style="color: #7F8C8D; margin-top: 15px;">No errors recorded yet! Complete some standard writing exercises first to build your error review list.</p>
        `;
        return;
    }

    // Filtra il dizionario prendendo solo le parole che hanno accumulato errori
    let errorItems = dictionaryData.filter(w => errorTrackingCounts[w.en] > 0);
    // Ordina in base al numero di errori decrescente
    errorItems.sort((a, b) => errorTrackingCounts[b.en] - errorTrackingCounts[a.en]);

    practiceList = errorItems;
    totalSessionTarget = practiceList.length;
    sessionCompletedCount = 0;
    generateWritingExercise();
}

function submitEssayForCorrection() {
    const text = document.getElementById('essayInput').value.trim();
    const feedback = document.getElementById('essayFeedback');
    
    if (!text) {
        feedback.innerHTML = "<p style='color:var(--danger); font-weight:bold;'>Please write something first!</p>";
        return;
    }

    feedback.innerHTML = `
        <div style="background: white; padding: 15px; border-radius: 6px; border: 1px solid #E5E7E9;">
            <h4 style="color: var(--success); margin-top:0;">✅ Correction & Feedback Report</h4>
            <p><strong>Grammar & Style Check:</strong> Well written text! Good flow and syntax.</p>
            <p style="color: var(--primary); font-weight: bold;">📦 Dictionary Update:</p>
            <ul id="extractedWordsList" style="margin: 5px 0; padding-left: 20px;"></ul>
        </div>
    `;

    const wordsInText = text.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g,"").split(/\s+/);
    let addedCount = 0;
    const listEl = document.getElementById('extractedWordsList');
    listEl.innerHTML = "";

    wordsInText.forEach(w => {
        if (w.length > 5) {
            const cleanWord = w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
            const exists = dictionaryData.some(item => item.en.toLowerCase() === cleanWord.toLowerCase());
            if (!exists) {
                const newEntry = {
                    day: "Custom",
                    category: "User Essays",
                    en: cleanWord,
                    fig: cleanWord.toLowerCase().split('').join('-'),
                    it: "Termine estratto da saggio",
                    es: "Término de ensayo",
                    da: "Brugerudtryk",
                    sentence: `Example: "${text.substring(0, 40)}..."`
                };
                customAddedWords.push(newEntry);
                dictionaryData.push(newEntry);
                localStorage.setItem('eng_custom_dictionary', JSON.stringify(customAddedWords));
                
                const li = document.createElement('li');
                li.innerHTML = `Added new word: <strong>${cleanWord}</strong> to Dictionary!`;
                listEl.appendChild(li);
                addedCount++;
            }
        }
    });

    if (addedCount === 0) {
        const li = document.createElement('li');
        li.textContent = "No new complex vocabulary words detected to add.";
        listEl.appendChild(li);
    }

    renderRepository(dictionaryData);
    updateStatsDisplay();
}

function restartWritingSession() {
    const selectVal = document.getElementById('sessionSizeSelect').value;
    if (selectVal === 'all') {
        totalSessionTarget = dictionaryData.length;
    } else {
        totalSessionTarget = parseInt(selectVal);
    }

    sessionCompletedCount = 0;
    
    let shuffled = [...dictionaryData].sort(() => Math.random() - 0.5);
    
    if (shuffled.length > totalSessionTarget) {
        practiceList = shuffled.slice(0, totalSessionTarget);
    } else {
        practiceList = shuffled;
        totalSessionTarget = practiceList.length;
    }

    generateWritingExercise();
    updateStatsDisplay();
}

function initCategorySelect() {
    const categories = [...new Set(dictionaryData.map(w => w.category))].sort();
    const select = document.getElementById('categorySelect');
    select.innerHTML = '<option value="">📂 All categories</option>';
    categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        select.appendChild(option);
    });
}

function loadDailyCards() {
    const words = dictionaryData.filter(w => w.day === 1);
    let html = `<table><thead><tr><th>Inglese</th><th>Pronuncia</th><th>🇮🇹 Italiano</th><th>🇪🇸 Español</th><th>🇩🇰 Dansk</th></tr></thead><tbody>`;
    words.forEach(w => {
        html += `<tr>
            <td><strong>${w.en}</strong> <button class="audio-btn" onclick="speak('${w.en}')">🔊</button></td>
            <td><em>${w.fig}</em></td>
            <td>${w.it}</td>
            <td>${w.es}</td>
            <td>${w.da}</td>
        </tr>`;
    });
    html += `</tbody></table>`;
    document.getElementById('dailyTableContainer').innerHTML = html;
}

function renderRepository(words) {
    const container = document.getElementById('repoTableContainer');
    if (words.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--danger); font-weight: bold; margin-top: 20px;">No words found</p>`;
        return;
    }

    const sortedWords = [...words].sort((a, b) => {
        if (a.category < b.category) return -1;
        if (a.category > b.category) return 1;
        return a.en.localeCompare(b.en);
    });

    const grouped = {};
    sortedWords.forEach(w => {
        if (!grouped[w.category]) grouped[w.category] = [];
        grouped[w.category].push(w);
    });

    let html = "";
    for (const [category, catWords] of Object.entries(grouped)) {
        html += `<div class="category-title">📂 ${category}</div>`;
        html += `<table><thead><tr><th>Inglese</th><th>Pronuncia</th><th>🇮🇹 Italiano</th><th>🇪🇸 Español</th><th>🇩🇰 Dansk</th><th>Day</th></tr></thead><tbody>`;
        catWords.forEach(w => {
            html += `<tr>
                <td><strong>${w.en}</strong> <button class="audio-btn" onclick="speak('${w.en}')">🔊</button></td>
                <td><em>${w.fig}</em></td>
                <td>${w.it}</td>
                <td>${w.es}</td>
                <td>${w.da}</td>
                <td>${w.day === 'Custom' ? 'Custom' : 'Day ' + w.day}</td>
            </tr>`;
        });
        html += `</tbody></table>`;
    }
    container.innerHTML = html;
}

function filterRepository() {
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const selectedCategory = document.getElementById('categorySelect').value;

    const filtered = dictionaryData.filter(w => {
        const matchesSearch = search === "" || 
            w.en.toLowerCase().includes(search) || 
            w.it.toLowerCase().includes(search) ||
            w.es.toLowerCase().includes(search) ||
            w.da.toLowerCase().includes(search);

        const matchesCategory = selectedCategory === "" || w.category === selectedCategory;
        return matchesSearch && matchesCategory;
    });
    renderRepository(filtered);
}

function speak(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    window.speechSynthesis.speak(utterance);
}

function switchTab(tabId, event) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');

    if (tabId === 'writing') {
        const mode = document.getElementById('writingModeSelect').value;
        if (mode === 'practice') {
            if (practiceList.length === 0 && sessionCompletedCount >= totalSessionTarget) {
                restartWritingSession();
            } else {
                generateWritingExercise();
            }
        } else if (mode === 'reviewErrors') {
            startErrorReviewSession();
        }
    }
    if (tabId === 'listening') loadListeningExercise();
    if (tabId === 'stats') updateStatsDisplay();
}

function generateWritingExercise() {
    const area = document.getElementById('writingArea');
    
    if (practiceList.length === 0) {
        area.innerHTML = `
            <h3>🎉 Session Completed!</h3>
            <p>You have successfully completed all questions in this session.</p>
            <br>
            <button class="action-btn" onclick="restartWritingSession()">Start New Session</button>
        `;
        return;
    }

    currentWritingData = practiceList[0];
    currentWritingType = Math.floor(Math.random() * 3) + 1;

    let progressHtml = `
        <div class="writing-header-bar">
            <span>📝 Progress: ${sessionCompletedCount} / ${totalSessionTarget} done</span>
        </div>
    `;

    if (currentWritingType === 1) {
        area.innerHTML = progressHtml + `
            <h3>✍️ Exercise: Translate to English</h3>
            <p>Translate this Italian expression:</p>
            <h2 style="color: var(--primary);">${currentWritingData.it}</h2>
            <p><small>Pronunciation: <em>${currentWritingData.fig}</em></small></p>
            <input type="text" id="writingInput" placeholder="Type in English..." autocomplete="off">
            <br><br>
            <button class="action-btn" onclick="checkWritingAnswer()">Check Answer</button>
            <p id="writingFeedback"></p>
        `;
    } else if (currentWritingType === 2) {
        let sentenceWithBlank = currentWritingData.sentence.includes(currentWritingData.en) ? 
            currentWritingData.sentence.replace(currentWritingData.en, "_____") : 
            `Complete sentence for: ${currentWritingData.en} (_____)`;
            
        area.innerHTML = progressHtml + `
            <h3>✍️ Exercise: Complete the Sentence</h3>
            <p>Fill in the blank with the correct English word:</p>
            <h3 style="background: white; padding: 12px; border-radius: 6px; border: 1px solid #E5E7E9;">"${sentenceWithBlank}"</h3>
            <p><small>Italian hint: <strong>${currentWritingData.it}</strong></small></p>
            <input type="text" id="writingInput" placeholder="Missing word..." autocomplete="off">
            <br><br>
            <button class="action-btn" onclick="checkWritingAnswer()">Check Answer</button>
            <p id="writingFeedback"></p>
        `;
    } else {
        let options = [currentWritingData.en];
        while(options.length < 4) {
            let rand = dictionaryData[Math.floor(Math.random() * dictionaryData.length)].en;
            if(!options.includes(rand)) options.push(rand);
        }
        options.sort(() => Math.random() - 0.5);

        area.innerHTML = progressHtml + `
            <h3>✍️ Exercise: Match the Translation</h3>
            <p>Select the correct English word for:</p>
            <h2 style="color: var(--primary);">"${currentWritingData.it}"</h2>
            <div class="quiz-options">
                ${options.map(opt => `<button class="quiz-btn" onclick="checkMatchingAnswer(this, '${opt}')">${opt}</button>`).join('')}
            </div>
            <p id="writingFeedback"></p>
        `;
    }
}

function incrementCompletedCount() {
    globalCompletedCount++;
    localStorage.setItem('eng_completed_count', globalCompletedCount);
}

function registerError(wordStr) {
    errorTrackingCounts[wordStr] = (errorTrackingCounts[wordStr] || 0) + 1;
    localStorage.setItem('eng_error_tracking', JSON.stringify(errorTrackingCounts));
}

function checkWritingAnswer() {
    const inputField = document.getElementById('writingInput');
    const input = inputField.value.trim().toLowerCase();
    const feedback = document.getElementById('writingFeedback');
    
    if (input === currentWritingData.en.toLowerCase()) {
        practiceList.shift();
        sessionCompletedCount++;
        incrementCompletedCount();
        feedback.innerHTML = "<strong style='color:var(--success)'>Correct! 🎉 Loading next...</strong>";
        setTimeout(generateWritingExercise, 1000);
    } else {
        registerError(currentWritingData.en);
        practiceList.shift();
        sessionCompletedCount++;
        feedback.innerHTML = `<span style='color:var(--danger)'>Incorrect. The correct word was: <strong>${currentWritingData.en}</strong>. Counted in error ranking.</span>`;
        setTimeout(generateWritingExercise, 2000);
    }
    updateStatsDisplay();
}

function checkMatchingAnswer(btn, selected) {
    const feedback = document.getElementById('writingFeedback');
    if (selected === currentWritingData.en) {
        btn.classList.add('correct');
        practiceList.shift();
        sessionCompletedCount++;
        incrementCompletedCount();
        feedback.innerHTML = "<strong style='color:var(--success)'>Correct match! 🎉 Loading next...</strong>";
        setTimeout(generateWritingExercise, 1000);
    } else {
        btn.classList.add('wrong');
        registerError(currentWritingData.en);
        practiceList.shift();
        sessionCompletedCount++;
        feedback.innerHTML = `<span style='color:var(--danger)'>Wrong. It was: ${currentWritingData.en}. Counted in error ranking.</span>`;
        setTimeout(generateWritingExercise, 2000);
    }
    updateStatsDisplay();
}

function loadListeningExercise() {
    const category = document.getElementById('listeningCategorySelect').value;
    const videoList = listeningDatabase[category];
    const currentIndex = currentVideoIndexes[category];
    const currentEx = videoList[currentIndex];

    document.getElementById('youtubeContainer').innerHTML = `
        <iframe src="https://www.youtube.com/embed/${currentEx.videoId}" allowfullscreen></iframe>
    `;

    document.getElementById('videoCounter').innerText = `${currentIndex + 1}/${videoList.length}`;

    let linesHtml = "";
    currentEx.lines.forEach((line, index) => {
        linesHtml += `<div class="listening-line"><strong>Sentence ${index + 1}:</strong> ${line}</div>`;
    });
    document.getElementById('listeningSentencesContainer').innerHTML = linesHtml;
    document.getElementById('listeningFeedback').innerHTML = "";
}

function changeListeningCategory() {
    loadListeningExercise();
}

function nextVideoInCategory() {
    const category = document.getElementById('listeningCategorySelect').value;
    const videoList = listeningDatabase[category];
    
    currentVideoIndexes[category] = (currentVideoIndexes[category] + 1) % videoList.length;
    loadListeningExercise();
}

function checkListeningAnswers() {
    const inputs = document.querySelectorAll('#listeningSentencesContainer .blank-input');
    const feedback = document.getElementById('listeningFeedback');
    let correct = true;
    
    inputs.forEach(input => {
        const expected = input.getAttribute('data-ans').toLowerCase();
        if (input.value.trim().toLowerCase() === expected) {
            input.style.borderColor = "var(--success)";
            input.style.backgroundColor = "#e8f8f0";
        } else {
            input.style.borderColor = "var(--danger)";
            input.style.backgroundColor = "#fdeed9";
            correct = false;
        }
    });

    if(correct) {
        feedback.innerHTML = "<strong style='color:var(--success)'>All sentences are correct! Great job! 🎉</strong>";
        incrementCompletedCount();
    } else {
        feedback.innerHTML = "<span style='color:var(--danger)'>Some highlighted fields have errors. Listen again and try!</span>";
    }
    updateStatsDisplay();
}

function updateStatsDisplay() {
    document.getElementById('statTotalWords').innerText = dictionaryData.length;
    document.getElementById('statCompleted').innerText = globalCompletedCount;
    
    let progress = Math.round((sessionCompletedCount / totalSessionTarget) * 100) || 0;
    document.getElementById('statProgress').innerText = progress + "%";

    let totalErrorsCount = Object.values(errorTrackingCounts).reduce((a, b) => a + b, 0);
    document.getElementById('statTotalErrors').innerText = totalErrorsCount;

    // Render Top 10 Cumulative Error Ranking
    const sortedErrors = Object.entries(errorTrackingCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const rankingContainer = document.getElementById('errorRankingContainer');
    
    if (sortedErrors.length === 0) {
        rankingContainer.innerHTML = `<p style="color: #7F8C8D; font-style: italic; font-size: 0.9rem;">No errors recorded yet. Keep practicing!</p>`;
    } else {
        let rankHtml = `<table><thead><tr><th>Rank</th><th>Word</th><th>Errors</th></tr></thead><tbody>`;
        sortedErrors.forEach(([word, count], idx) => {
            rankHtml += `<tr>
                <td>#${idx + 1}</td>
                <td><strong>${word}</strong> <button class="audio-btn" onclick="speak('${word}')" style="width:22px; height:22px; font-size:0.7rem;">🔊</button></td>
                <td><span style="color:var(--danger); font-weight:bold;">${count}</span></td>
            </tr>`;
        });
        rankHtml += `</tbody></table>`;
        rankingContainer.innerHTML = rankHtml;
    }
}

function resetStatsData() {
    if (confirm("Are you sure you want to reset your general statistics? (Error ranking will be preserved as requested)")) {
        globalCompletedCount = 0;
        localStorage.removeItem('eng_completed_count');
        updateStatsDisplay();
        alert("General statistics have been reset (Error history remains intact).");
    }
}

initApp();
</script>
